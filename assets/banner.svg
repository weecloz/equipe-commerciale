<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="416" y2="0">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="18" fill="#0B0D12"/>
  <rect width="1280" height="440" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="440" rx="18" fill="url(#glow)"/>

  <!-- left: title -->
  <g transform="translate(72 0)">
    <rect y="74" width="214" height="34" rx="17" fill="#D97757" fill-opacity="0.14" stroke="#D97757" stroke-opacity="0.5"/>
    <circle cx="20" cy="91" r="5" fill="#D97757"/>
    <text x="34" y="97" font-size="15" font-weight="600" fill="#F2B49D" letter-spacing="0.4">PLUGIN CLAUDE CODE</text>

    <text y="172" font-size="50" font-weight="700" fill="#F4F5F8" letter-spacing="-1.2">Ton équipe commerciale</text>
    <text y="232" font-size="50" font-weight="700" fill="#F4F5F8" letter-spacing="-1.2">dans <tspan fill="#D97757">Claude Code</tspan></text>

    <text y="286" font-size="21" fill="#9AA3B5">Tu donnes une mission au chef. Il répartit le travail.</text>
    <text y="316" font-size="21" fill="#9AA3B5">Chaque agent te rend un fichier prêt à utiliser.</text>

    <g transform="translate(0 352)" font-size="17" font-weight="600">
      <rect width="96" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="48" y="25" text-anchor="middle" fill="#F4F5F8">1 chef</text>
      <rect x="108" width="126" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="171" y="25" text-anchor="middle" fill="#F4F5F8">40 agents</text>
      <rect x="246" width="176" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="334" y="25" text-anchor="middle" fill="#F4F5F8">10 départements</text>
    </g>
  </g>

  <!-- right: org chart -->
  <g transform="translate(770 60)">
    <rect x="130" y="0" width="200" height="48" rx="12" fill="#1A2133" stroke="#2F6BFF" stroke-opacity="0.8"/>
    <text x="230" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">/equipe · le chef</text>
    <path d="M230 48 V74" stroke="#2F6BFF" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M44 74 H416" stroke="url(#line)" stroke-width="2"/><path d="M112 74 V92 M348 74 V92" stroke="#2F6BFF" stroke-opacity="0.35" stroke-width="2"/>

    <g font-size="14" font-weight="600" fill="#DDE2EC">
      <g transform="translate(0 92)">
        <rect width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="20" cy="20" r="4" fill="#2F6BFF"/><text x="34" y="25">Stratégie et ciblage</text>
        <rect x="236" width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="256" cy="20" r="4" fill="#2F6BFF"/><text x="270" y="25">Recherche de prospects</text>
      </g>
      <g transform="translate(0 142)">
        <rect width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="20" cy="20" r="4" fill="#2F6BFF"/><text x="34" y="25">Prospection</text>
        <rect x="236" width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="256" cy="20" r="4" fill="#2F6BFF"/><text x="270" y="25">Qualification</text>
      </g>
      <g transform="translate(0 192)">
        <rect width="224" height="40" rx="9" fill="#141824" stroke="#D97757" stroke-opacity="0.6"/><circle cx="20" cy="20" r="4" fill="#D97757"/><text x="34" y="25">Analyse des calls</text>
        <rect x="236" width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="256" cy="20" r="4" fill="#2F6BFF"/><text x="270" y="25">Démos</text>
      </g>
      <g transform="translate(0 242)">
        <rect width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="20" cy="20" r="4" fill="#2F6BFF"/><text x="34" y="25">Propositions</text>
        <rect x="236" width="224" height="40" rx="9" fill="#141824" stroke="#D97757" stroke-opacity="0.6"/><circle cx="256" cy="20" r="4" fill="#D97757"/><text x="270" y="25">Objections et négo</text>
      </g>
      <g transform="translate(0 292)">
        <rect width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="20" cy="20" r="4" fill="#2F6BFF"/><text x="34" y="25">Suivi du pipeline</text>
        <rect x="236" width="224" height="40" rx="9" fill="#141824" stroke="#262D3D"/><circle cx="256" cy="20" r="4" fill="#2F6BFF"/><text x="270" y="25">Comptes clients</text>
      </g>
    </g>
  </g>
</svg>
